version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [redis]
    volumes:
      - ./app:/app/app
      - clip_storage:/data

  worker:
    build: .
    env_file: .env
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    depends_on: [redis]
    volumes:
      - ./app:/app/app
      - clip_storage:/data

  flower:
    build: .
    env_file: .env
    command: celery -A app.workers.celery_app flower --port=5555
    ports: ["5555:5555"]
    depends_on: [redis, worker]

volumes:
  clip_storage:
